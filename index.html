    <!-- Dev environment Vite HMR WebSocket safe handler -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // Suppress unhandled rejection from WebSocket
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && event.reason.message && event.reason.message.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        // Suppress window error from WebSocket
        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('[vite]') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        // Suppress console error noise
        var origConsoleError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        // Mock WebSocket for vite-hmr so isOpened resolves cleanly without error
        var OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        window.WebSocket = function(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1))) {
            var listeners = {};
            var fakeWs = {
              readyState: 1, // OPEN
              url: url,
              protocol: 'vite-hmr',
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              addEventListener: function(event, fn) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(fn);
                if (event === 'open') {
                  setTimeout(function() {
                    try { fn({ type: 'open', target: fakeWs }); } catch(e) {}
                  }, 0);
                }
              },
              removeEventListener: function(event, fn) {
                if (!listeners[event]) return;
                listeners[event] = listeners[event].filter(function(l) { return l !== fn; });
              },
              dispatchEvent: function(event) {
                var list = listeners[event.type] || [];
                list.forEach(function(l) {
                  try { l(event); } catch(e) {}
                });
                return true;
              },
              send: function() {},
              close: function(code, reason) {
                fakeWs.readyState = 3;
                var list = listeners['close'] || [];
                list.forEach(function(l) {
                  try { l({ type: 'close', wasClean: true, code: 1000, reason: reason }); } catch(e) {}
                });
              },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };

            setTimeout(function() {
              if (typeof fakeWs.onopen === 'function') {
                fakeWs.onopen({ type: 'open', target: fakeWs });
              }
            }, 0);

            return fakeWs;
          }
          return new OriginalWebSocket(url, protocols);
        };

        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      })();
    </script>
