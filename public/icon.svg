<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with safe zone rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" />

  <!-- Shield / Council Emblem Inside Safe Zone (80% circle) -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Council / Cartable Board -->
    <rect x="20" y="40" width="260" height="280" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    <!-- Cartable Clip -->
    <rect x="100" y="24" width="100" height="32" rx="10" fill="#0284c7"/>
    <circle cx="150" cy="40" r="6" fill="#f8fafc"/>
    
    <!-- Checklist items inside board -->
    <!-- Item 1 with checkmark -->
    <circle cx="64" cy="110" r="14" fill="#10b981"/>
    <path d="M57 110 L62 115 L71 104" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="94" y1="110" x2="230" y2="110" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Item 2 with vote checkmark -->
    <circle cx="64" cy="165" r="14" fill="#6366f1"/>
    <path d="M57 165 L62 170 L71 159" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="94" y1="165" x2="200" y2="165" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Item 3 with revision badge -->
    <circle cx="64" cy="220" r="14" fill="#f59e0b"/>
    <path d="M64 212 V222 M64 227 V229" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="94" y1="220" x2="240" y2="220" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Dynamic star/stamp in corner -->
    <circle cx="230" cy="270" r="30" fill="url(#goldGrad)"/>
    <path d="M230 252 L234 264 L246 264 L236 272 L240 284 L230 276 L220 284 L224 272 L214 264 L226 264 Z" fill="#ffffff"/>
  </g>
</svg>
